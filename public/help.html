<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Needtable 使用帮助：表格、公式、透视表、图表、文档、幻灯片、分享权限的用法，以及全部函数说明。" data-i18n-attr="content">
  <title>帮助中心 · Needtable</title>

<body>
<header class="top">

<div class="layout">
